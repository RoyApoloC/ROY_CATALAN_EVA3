{% extends "base.html" %}

{% block titulo %}Ejercicio 1{% endblock %}

{% block contenido %}
<div class="tarjeta">
    <h1>Formulario de Notas</h1>
    <form method="POST" action="{{ url_for('ejercicio1') }}">
        <label for="nota1">Nota 1:</label>
        <input type="number" step="0.1" min="10" max="70" id="nota1" name="nota1" required>

        <label for="nota2">Nota 2:</label>
        <input type="number" step="0.1" min="10" max="70" id="nota2" name="nota2" required>

        <label for="nota3">Nota 3:</label>
        <input type="number" step="0.1" min="10" max="70" id="nota3" name="nota3" required>

        <label for="asistencia">Asistencia (%):</label>
        <input type="number" step="1" min="0" max="100" id="asistencia" name="asistencia" required>

        <button type="submit">Enviar</button>
    </form>

    {% if promedio is not none %}
        <p class="resultado">{{ promedio }}</p>
        <p class="resultado">{{ estado }}</p>
    {% endif %}

    <a class="volver" href="{{ url_for('index') }}">← Volver al menú</a>
</div>
{% endblock %}
